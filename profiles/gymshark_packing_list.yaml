name: gymshark_packing_list

# Matched against the first `rows` rows of every sheet (case-insensitive substring).
# The title is usually a few rows down: supplier name, address, then "PACKING LIST".
match:
  any_of:
    - "PACKING LIST"
  rows: 5
  # Words alone are not enough - a notes tab can mention "packing list". At least one
  # of these structural labels must also be present, which rules out cover/notes tabs.
  require_any:
    - "CTN NO"
    - "STYLE NO"
    - "SPLIT PO NO"
  # Second route in: recognise the document even when the words "PACKING LIST" are
  # missing. Every label in a group must sit on the SAME header row - a carton table
  # carries carton no, carton qty, net and gross weight together; nothing else does.
  signature:
    - ["CTN NO", "CTN QTY", "N.W", "G.W"]
    - ["CTN NO", "CTN QTY", "NET", "GROSS"]
  signature_rows: 100

fields:
  doc_type:
    cell: [2, 0]
  supplier:
    cell: [0, 0]
  supplier_address:
    cell: [1, 0]
    strip_prefix: "ADDRESS:"
  style_no:
    label: "STYLE NO"
  split_po_no:
    label: "SPLIT PO NO"
  description:
    label: "DESCRIPTION"
  order_qty:
    label: "ORDER QTY"
    cast: int
  ship_qty:
    label: "SHIP QTY"
    cast: int
  # The value cell is blank in these documents; recover the order number from the
  # file name (…-GS-3844 SEA CA.csv) and flag it for review.
  order_no:
    label: "ORDER NO"
    fallback_filename_regex: '-GS-(\d+)\s'
    fallback_severity: review
  # Buyer code and destination are not labelled fields in these documents; both are
  # encoded in the file name (JMF-26-GS-3844 SEA CA) and reported as low-risk notes.
  buyer:
    fallback_filename_regex: '-\d{2}-([A-Z]+)-\d+'
    fallback_severity: review
  # Filename ends with the lane: "3844 SEA CA" -> CA.
  # Matched against the file name *without* its extension, so a copy saved as
  # "… SEA CA (2).xlsx" still yields CA.
  destination:
    fallback_filename_regex: '\s([A-Z]{2})(?:\s*\(\d+\))?$'
    fallback_severity: review
  total_cartons:
    label: "TOTAL CARTON"
    label_value_offset: 4
    cast: int
  total_net_kg:
    label: "TOTAL NET WEIGHT"
    label_value_offset: 4
    cast: float
  total_gross_kg:
    label: "TOTAL GROSS WEIGHT"
    label_value_offset: 4
    cast: float
  total_cbm:
    label: "TOTAL CBM"
    label_value_offset: 4
    cast: float

cartons:
  header_label: "CTN NO"
  stop_label: "SUMMARY"
  carton_no_col: 0
  # "CTN QTY" sits immediately right of "CTN NO". The header's total-carton figure
  # reconciles with this column, not with a count of rows: one row can cover several
  # cartons, so counting rows undercounts the batch.
  ctn_count_col: 2
  colour_col: 3
  size_start_col: 5
  size_end_col: 12
  per_ctn_col: 13
  total_pcs_col: 14
  net_col: 17
  gross_col: 18
  cbm_col: 20
