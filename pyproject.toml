[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autobook"
version = "0.1.0"
description = "Packing list intake and data sheet preparation for booking automation"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.0"]

[project.gui-scripts]
autobook = "autobook.ui.app:main"

[tool.setuptools.packages.find]
include = ["autobook*"]

[tool.setuptools.package-data]
autobook = ["../profiles/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
